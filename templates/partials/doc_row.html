<div class="doc-row status-{{ d.status }}">
  <div class="doc-cat">{{ d.categoria }}</div>
  <div class="doc-nome">
    {{ d.nome }}
    <span class="doc-versao">v{{ d.versao_atual }}</span>
  </div>
  <div class="doc-period">{{ d.periodicidade }}</div>
  <div class="doc-data">{{ d.proxima_revisao_str }}</div>
  <div class="doc-acoes">
    {% if d.categoria != 'Certificado' %}
    <a href="/abrir/{{ d.id }}" class="doc-btn-sm" title="Abrir no editor">✏</a>
    {% endif %}
    <a href="/ver/{{ d.id }}" class="doc-btn-sm" title="Ver / Exportar" target="_blank">↗</a>
    <button class="doc-btn-revisar" onclick="abrirModal({{ d.id }}, '{{ d.nome|replace("'","\\'") }}', '{{ d.proxima_versao_sugerida }}')">Revisar →</button>
  </div>
</div>
